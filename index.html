<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrossRealm - Play Chess & Checkers</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #fff;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        h1 {
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .wallet-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }

        .btn-danger {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .tab {
            flex: 1;
            min-width: 150px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .tab.active {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .game-section {
            background: rgba(0, 0, 0, 0.3);
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }

        .create-game-form {
            display: grid;
            gap: 20px;
            max-width: 600px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: bold;
            font-size: 1.1em;
        }

        input, select {
            padding: 12px;
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1em;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s;
        }

        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .game-card h3 {
            margin-bottom: 10px;
            color: #ffd700;
        }

        .game-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 15px 0;
        }

        .game-info span {
            display: flex;
            justify-content: space-between;
        }

        .game-board {
            display: grid;
            gap: 2px;
            background: #333;
            padding: 10px;
            border-radius: 10px;
            margin: 20px auto;
            max-width: 600px;
        }

        .chess-board {
            grid-template-columns: repeat(8, 1fr);
        }

        .checkers-board {
            grid-template-columns: repeat(8, 1fr);
        }

        .square {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            cursor: pointer;
            transition: all 0.2s;
        }

        .square.light {
            background: #f0d9b5;
        }

        .square.dark {
            background: #b58863;
        }

        .square.selected {
            background: #baca44 !important;
        }

        .square.valid-move {
            background: rgba(186, 202, 68, 0.5) !important;
        }

        .square:hover {
            opacity: 0.8;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 0.9em;
            font-weight: bold;
        }

        .status-active {
            background: #11998e;
        }

        .status-finished {
            background: #666;
        }

        .status-waiting {
            background: #f39c12;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px;
            border-radius: 20px;
            max-width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .loading {
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .alert {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .alert-success {
            background: rgba(17, 153, 142, 0.3);
            border: 2px solid #11998e;
        }

        .alert-danger {
            background: rgba(235, 51, 73, 0.3);
            border: 2px solid #eb3349;
        }

        .alert-info {
            background: rgba(102, 126, 234, 0.3);
            border: 2px solid #667eea;
        }

        .move-history {
            max-height: 200px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .move-item {
            padding: 8px;
            margin: 5px 0;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .games-grid {
                grid-template-columns: 1fr;
            }

            .square {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <h1>🎮 CrossRealm Gaming</h1>
                <div class="wallet-info">
                    <span id="walletAddress">Not Connected</span>
                    <span id="balance">0 CORE</span>
                    <button class="btn" id="connectWallet">Connect Wallet</button>
                </div>
            </div>
        </header>

        <div class="tabs">
            <button class="tab active" data-tab="create">➕ Create Game</button>
            <button class="tab" data-tab="active">🎯 Active Games</button>
            <button class="tab" data-tab="my-games">👤 My Games</button>
            <button class="tab" data-tab="play">🎮 Play Game</button>
        </div>

        <!-- Create Game Tab -->
        <div class="tab-content active" id="create">
            <div class="game-section">
                <h2>Create New Game</h2>
                <form class="create-game-form" id="createGameForm">
                    <div class="form-group">
                        <label>Game Type</label>
                        <select id="gameType" required>
                            <option value="chess">♟️ Chess</option>
                            <option value="checkers">⚫ Checkers</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Opponent</label>
                        <select id="opponentType" required>
                            <option value="ai">🤖 AI (Computer)</option>
                            <option value="pvp">👥 Player vs Player</option>
                        </select>
                    </div>

                    <div class="form-group" id="opponentAddressGroup" style="display: none;">
                        <label>Opponent Address</label>
                        <input type="text" id="opponentAddress" placeholder="0x...">
                    </div>

                    <div class="form-group">
                        <label>Stake Amount (CORE)</label>
                        <input type="number" id="stakeAmount" step="0.01" min="0.01" value="0.1" required>
                    </div>

                    <div class="form-group">
                        <label>Time Limit (minutes, 0 = no limit)</label>
                        <input type="number" id="timeLimit" min="0" value="30" required>
                    </div>

                    <button type="submit" class="btn btn-success">Create Game</button>
                </form>
            </div>
        </div>

        <!-- Active Games Tab -->
        <div class="tab-content" id="active">
            <div class="game-section">
                <h2>Active Games</h2>
                <button class="btn" id="refreshGames">🔄 Refresh</button>
                <div class="games-grid" id="activeGamesGrid">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Loading games...</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- My Games Tab -->
        <div class="tab-content" id="my-games">
            <div class="game-section">
                <h2>My Games</h2>
                <button class="btn" id="refreshMyGames">🔄 Refresh</button>
                <div class="games-grid" id="myGamesGrid">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Loading your games...</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Play Game Tab -->
        <div class="tab-content" id="play">
            <div class="game-section">
                <h2>Play Game</h2>
                <div id="gamePlayArea">
                    <div class="alert alert-info">
                        Select a game to play from the Active Games or My Games tab
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Game Modal -->
    <div class="modal" id="gameModal">
        <div class="modal-content">
            <h2 id="modalTitle">Game</h2>
            <div id="modalContent"></div>
            <button class="btn" onclick="closeModal()">Close</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/web3@latest/dist/web3.min.js"></script>
    <script>
        // Contract Configuration
        const HUB_ADDRESS = '0x2D0FA241F72B8d9576876E43643374e7088C677f';
        const HUB_ABI = [
            // Core functions
            "function createGame(string gameType, uint stake, address token, address opponent, uint timeLimit, bytes gameData) external payable returns (uint)",
            "function joinGame(uint gameId) external payable",
            "function makeMove(uint gameId, bytes moveData) external",
            "function forfeitGame(uint gameId) external",
            "function getGame(uint gameId) external view returns (tuple(uint id, string gameType, address player1, address player2, address winner, uint stake, address token, uint8 status, uint createdAt, uint lastMoveTime, uint timeLimit, bytes gameState))",
            "function getActiveGames() external view returns (uint[] memory)",
            "function getUserGames(address user) external view returns (uint[] memory)",
            "function gameCount() external view returns (uint)",
            
            // Events
            "event GameCreated(uint indexed gameId, string gameType, address indexed player1, address opponent, uint stake)",
            "event GameJoined(uint indexed gameId, address indexed player2)",
            "event MoveMade(uint indexed gameId, address indexed player, bytes moveData)",
            "event GameEnded(uint indexed gameId, address indexed winner, uint payout)"
        ];

        // Global variables
        let web3;
        let account;
        let hubContract;
        let currentGameId = null;

        // Initialize
        window.addEventListener('load', async () => {
            if (typeof window.ethereum !== 'undefined') {
                web3 = new Web3(window.ethereum);
                hubContract = new web3.eth.Contract(HUB_ABI, HUB_ADDRESS);
                setupEventListeners();
                checkConnection();
            } else {
                alert('Please install MetaMask or Core Wallet to use this app!');
            }
        });

        function setupEventListeners() {
            // Wallet connection
            document.getElementById('connectWallet').addEventListener('click', connectWallet);

            // Tabs
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => switchTab(tab.dataset.tab));
            });

            // Forms
            document.getElementById('createGameForm').addEventListener('submit', createGame);
            document.getElementById('opponentType').addEventListener('change', toggleOpponentAddress);
            document.getElementById('refreshGames').addEventListener('click', loadActiveGames);
            document.getElementById('refreshMyGames').addEventListener('click', loadMyGames);
        }

        async function checkConnection() {
            const accounts = await web3.eth.getAccounts();
            if (accounts.length > 0) {
                account = accounts[0];
                updateWalletDisplay();
                loadActiveGames();
            }
        }

        async function connectWallet() {
            try {
                const accounts = await ethereum.request({ method: 'eth_requestAccounts' });
                account = accounts[0];
                updateWalletDisplay();
                loadActiveGames();
                showAlert('Wallet connected successfully!', 'success');
            } catch (error) {
                console.error('Error connecting wallet:', error);
                showAlert('Failed to connect wallet: ' + error.message, 'danger');
            }
        }

        async function updateWalletDisplay() {
            const shortAddress = account.slice(0, 6) + '...' + account.slice(-4);
            document.getElementById('walletAddress').textContent = shortAddress;

            const balance = await web3.eth.getBalance(account);
            const balanceInCore = web3.utils.fromWei(balance, 'ether');
            document.getElementById('balance').textContent = parseFloat(balanceInCore).toFixed(4) + ' CORE';

            document.getElementById('connectWallet').textContent = 'Connected';
            document.getElementById('connectWallet').disabled = true;
        }

        function switchTab(tabName) {
            // Update tab buttons
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');

            // Update tab content
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            document.getElementById(tabName).classList.add('active');

            // Load data if needed
            if (tabName === 'active') loadActiveGames();
            if (tabName === 'my-games') loadMyGames();
        }

        function toggleOpponentAddress() {
            const opponentType = document.getElementById('opponentType').value;
            const addressGroup = document.getElementById('opponentAddressGroup');
            addressGroup.style.display = opponentType === 'pvp' ? 'block' : 'none';
        }

        async function createGame(e) {
            e.preventDefault();

            if (!account) {
                showAlert('Please connect your wallet first!', 'danger');
                return;
            }

            const gameType = document.getElementById('gameType').value;
            const opponentType = document.getElementById('opponentType').value;
            const stakeAmount = document.getElementById('stakeAmount').value;
            const timeLimit = document.getElementById('timeLimit').value;
            
            let opponent = '0x0000000000000000000000000000000000000000';
            if (opponentType === 'pvp') {
                opponent = document.getElementById('opponentAddress').value;
                if (!web3.utils.isAddress(opponent)) {
                    showAlert('Invalid opponent address!', 'danger');
                    return;
                }
            }

            try {
                showAlert('Creating game... Please confirm in your wallet.', 'info');

                const stakeWei = web3.utils.toWei(stakeAmount, 'ether');
                const timeLimitSeconds = parseInt(timeLimit) * 60;
                
                const tx = await hubContract.methods.createGame(
                    gameType,
                    stakeWei,
                    '0x0000000000000000000000000000000000000000', // CORE payment
                    opponent,
                    timeLimitSeconds,
                    '0x' // Empty game data
                ).send({
                    from: account,
                    value: stakeWei,
                    gas: 500000
                });

                showAlert('Game created successfully! Game ID: ' + tx.events.GameCreated.returnValues.gameId, 'success');
                document.getElementById('createGameForm').reset();
                
                // Switch to active games tab
                setTimeout(() => {
                    switchTab('active');
                    loadActiveGames();
                }, 2000);

            } catch (error) {
                console.error('Error creating game:', error);
                showAlert('Failed to create game: ' + error.message, 'danger');
            }
        }

        async function loadActiveGames() {
            try {
                const gameIds = await hubContract.methods.getActiveGames().call();
                const grid = document.getElementById('activeGamesGrid');
                grid.innerHTML = '';

                if (gameIds.length === 0) {
                    grid.innerHTML = '<div class="alert alert-info">No active games found. Create one!</div>';
                    return;
                }

                for (const id of gameIds) {
                    const game = await hubContract.methods.getGame(id).call();
                    grid.appendChild(createGameCard(game));
                }
            } catch (error) {
                console.error('Error loading games:', error);
                document.getElementById('activeGamesGrid').innerHTML = 
                    '<div class="alert alert-danger">Failed to load games</div>';
            }
        }

        async function loadMyGames() {
            if (!account) {
                document.getElementById('myGamesGrid').innerHTML = 
                    '<div class="alert alert-info">Connect wallet to see your games</div>';
                return;
            }

            try {
                const gameIds = await hubContract.methods.getUserGames(account).call();
                const grid = document.getElementById('myGamesGrid');
                grid.innerHTML = '';

                if (gameIds.length === 0) {
                    grid.innerHTML = '<div class="alert alert-info">You have no games yet. Create one!</div>';
                    return;
                }

                for (const id of gameIds) {
                    const game = await hubContract.methods.getGame(id).call();
                    grid.appendChild(createGameCard(game, true));
                }
            } catch (error) {
                console.error('Error loading my games:', error);
                document.getElementById('myGamesGrid').innerHTML = 
                    '<div class="alert alert-danger">Failed to load your games</div>';
            }
        }

        function createGameCard(game, isMyGame = false) {
            const card = document.createElement('div');
            card.className = 'game-card';

            const status = ['Active', 'Finished', 'Cancelled', 'Waiting'][game.status] || 'Unknown';
            const statusClass = status === 'Active' ? 'status-active' : 
                               status === 'Waiting' ? 'status-waiting' : 'status-finished';

            const stake = web3.utils.fromWei(game.stake, 'ether');
            const gameType = game.gameType.charAt(0).toUpperCase() + game.gameType.slice(1);
            
            const isAI = game.player2 === '0x0000000000000000000000000000000000000000' && game.status === 0;
            const opponentDisplay = isAI ? '🤖 AI' : 
                                   game.player2 === '0x0000000000000000000000000000000000000000' ? 
                                   'Waiting for opponent...' :
                                   game.player2.slice(0, 6) + '...' + game.player2.slice(-4);

            card.innerHTML = `
                <h3>${gameType} Game #${game.id}</h3>
                <span class="status-badge ${statusClass}">${status}</span>
                <div class="game-info">
                    <span><strong>Player 1:</strong> ${game.player1.slice(0, 6)}...${game.player1.slice(-4)}</span>
                    <span><strong>Player 2:</strong> ${opponentDisplay}</span>
                    <span><strong>Stake:</strong> ${stake} CORE</span>
                    ${game.timeLimit > 0 ? `<span><strong>Time Limit:</strong> ${game.timeLimit / 60} min</span>` : ''}
                </div>
                ${createGameButtons(game, isMyGame)}
            `;

            return card;
        }

        function createGameButtons(game, isMyGame) {
            if (!account) return '';

            const buttons = [];

            // Join game button
            if (game.status === 0 && game.player2 === '0x0000000000000000000000000000000000000000' && 
                game.player1.toLowerCase() !== account.toLowerCase()) {
                buttons.push(`<button class="btn btn-success" onclick="joinGame(${game.id})">Join Game</button>`);
            }

            // Play game button
            if (isMyGame && (game.status === 0 || game.status === 'Active')) {
                buttons.push(`<button class="btn" onclick="playGame(${game.id}, '${game.gameType}')">Play</button>`);
            }

            // Forfeit button
            if (isMyGame && game.status === 0) {
                buttons.push(`<button class="btn btn-danger" onclick="forfeitGame(${game.id})">Forfeit</button>`);
            }

            return buttons.length > 0 ? '<div style="display: flex; gap: 10px; margin-top: 15px;">' + buttons.join('') + '</div>' : '';
        }

        async function joinGame(gameId) {
            if (!account) {
                showAlert('Please connect your wallet first!', 'danger');
                return;
            }

            try {
                showAlert('Joining game... Please confirm in your wallet.', 'info');
                
                const game = await hubContract.methods.getGame(gameId).call();
                
                const tx = await hubContract.methods.joinGame(gameId).send({
                    from: account,
                    value: game.stake,
                    gas: 300000
                });

                showAlert('Successfully joined game!', 'success');
                loadActiveGames();
                loadMyGames();
            } catch (error) {
                console.error('Error joining game:', error);
                showAlert('Failed to join game: ' + error.message, 'danger');
            }
        }

        async function forfeitGame(gameId) {
            if (!confirm('Are you sure you want to forfeit this game?')) return;

            try {
                showAlert('Forfeiting game...', 'info');
                
                await hubContract.methods.forfeitGame(gameId).send({
                    from: account,
                    gas: 200000
                });

                showAlert('Game forfeited', 'success');
                loadMyGames();
            } catch (error) {
                console.error('Error forfeiting game:', error);
                showAlert('Failed to forfeit: ' + error.message, 'danger');
            }
        }

        async function playGame(gameId, gameType) {
            currentGameId = gameId;
            
            // Switch to play tab
            document.querySelector('[data-tab="play"]').click();
            
            // Load game board
            const playArea = document.getElementById('gamePlayArea');
            playArea.innerHTML = `
                <h3>${gameType.charAt(0).toUpperCase() + gameType.slice(1)} Game #${gameId}</h3>
                <div id="gameBoard"></div>
                <div class="move-history" id="moveHistory">
                    <h4>Move History</h4>
                    <div id="moveList"></div>
                </div>
                <div style="margin-top: 20px; display: flex; gap: 10px;">
                    <button class="btn btn-danger" onclick="forfeitGame(${gameId})">Forfeit</button>
                    <button class="btn" onclick="loadMyGames()">Refresh Game</button>
                </div>
            `;

            // Render board based on game type
            if (gameType === 'chess') {
                renderChessBoard(gameId);
            } else {
                renderCheckersBoard(gameId);
            }
        }

        function renderChessBoard(gameId) {
            const board = document.getElementById('gameBoard');
            board.className = 'game-board chess-board';
            board.innerHTML = '';

            // Initial chess setup
            const initialBoard = [
                ['♜', '♞', '♝', '♛', '♚', '♝', '♞', '♜'],
                ['♟', '♟', '♟', '♟', '♟', '♟', '♟', '♟'],
                ['', '', '', '', '', '', '', ''],
                ['', '', '', '', '', '', '', ''],
                ['', '', '', '', '', '', '', ''],
                ['', '', '', '', '', '', '', ''],
                ['♙', '♙', '♙', '♙', '♙', '♙', '♙', '♙'],
                ['♖', '♘', '♗', '♕', '♔', '♗', '♘', '♖']
            ];

            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const square = document.createElement('div');
                    square.className = 'square ' + ((row + col) % 2 === 0 ? 'light' : 'dark');
                    square.textContent = initialBoard[row][col];
                    square.dataset.row = row;
                    square.dataset.col = col;
                    square.addEventListener('click', () => handleSquareClick(row, col, 'chess'));
                    board.appendChild(square);
                }
            }
        }

        function renderCheckersBoard(gameId) {
            const board = document.getElementById('gameBoard');
            board.className = 'game-board checkers-board';
            board.innerHTML = '';

            // Initial checkers setup
            const initialBoard = [
                ['', '⚫', '', '⚫', '', '⚫', '', '⚫'],
                ['⚫', '', '⚫', '', '⚫', '', '⚫', ''],
                ['', '⚫', '', '⚫', '', '⚫', '', '⚫'],
                ['', '', '', '', '', '', '', ''],
                ['', '', '', '', '', '', '', ''],
                ['⚪', '', '⚪', '', '⚪', '', '⚪', ''],
                ['', '⚪', '', '⚪', '', '⚪', '', '⚪'],
                ['⚪', '', '⚪', '', '⚪', '', '⚪', '']
            ];

            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const square = document.createElement('div');
                    square.className = 'square ' + ((row + col) % 2 === 0 ? 'light' : 'dark');
                    square.textContent = initialBoard[row][col];
                    square.dataset.row = row;
                    square.dataset.col = col;
                    square.addEventListener('click', () => handleSquareClick(row, col, 'checkers'));
                    board.appendChild(square);
                }
            }
        }

        let selectedSquare = null;

        function handleSquareClick(row, col, gameType) {
            const squares = document.querySelectorAll('.square');
            const clickedSquare = Array.from(squares).find(
                sq => sq.dataset.row == row && sq.dataset.col == col
            );

            if (!selectedSquare) {
                // Select piece
                if (clickedSquare.textContent) {
                    selectedSquare = { row, col };
                    clickedSquare.classList.add('selected');
                }
            } else {
                // Make move
                const fromRow = selectedSquare.row;
                const fromCol = selectedSquare.col;
                
                makeMove(currentGameId, fromRow, fromCol, row, col, gameType);
                
                // Clear selection
                squares.forEach(sq => sq.classList.remove('selected'));
                selectedSquare = null;
            }
        }

        async function makeMove(gameId, fromRow, fromCol, toRow, toCol, gameType) {
            try {
                showAlert('Making move...', 'info');

                // Encode move data
                const moveData = web3.eth.abi.encodeParameters(
                    ['uint8', 'uint8', 'uint8', 'uint8'],
                    [fromRow, fromCol, toRow, toCol]
                );

                const tx = await hubContract.methods.makeMove(gameId, moveData).send({
                    from: account,
                    gas: 300000
                });

                showAlert('Move made successfully!', 'success');
                
                // Refresh board
                if (gameType === 'chess') {
                    renderChessBoard(gameId);
                } else {
                    renderCheckersBoard(gameId);
                }
            } catch (error) {
                console.error('Error making move:', error);
                showAlert('Failed to make move: ' + error.message, 'danger');
            }
        }

        function showAlert(message, type) {
            const existingAlert = document.querySelector('.alert');
            if (existingAlert) existingAlert.remove();

            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            
            document.querySelector('.container').insertBefore(alert, document.querySelector('.tabs'));

            setTimeout(() => alert.remove(), 5000);
        }

        function closeModal() {
            document.getElementById('gameModal').classList.remove('active');
        }
    </script>
</body>
</html>
